# Search policy: budgets, mix, stop rules for the adaptive discovery cycle.
batch_size: 5
max_batches_per_mode: 3
mix_policy:
  proven: 0.30
  variation: 0.40
  exploratory: 0.20
  entity_targeted: 0.10
stop_rules:
  min_new_per_query: 1
  max_duplicate_rate: 0.8
  authwall_or_captcha: stop
low_yield_threshold: 3
high_yield_threshold: 8
broaden_after_low_yield: true
