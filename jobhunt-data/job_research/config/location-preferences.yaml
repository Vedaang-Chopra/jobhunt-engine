# Location Preferences Configuration
# Geographic targeting for job search and referral outreach

location_tiers:
  tier_1_primary:
    name: "United States"
    priority: 1
    reason: "Primary target - H-1B sponsorship possible, most target companies headquartered here"
    cities:
      - "San Francisco Bay Area"       # SF, Palo Alto, Mountain View, San Jose, Redwood City
      - "New York City"                # Manhattan, Brooklyn
      - "Seattle"                      # Amazon, Microsoft, AI2
      - "Los Angeles"                  # Runway, Google LA, Snap
      - "Boston / Cambridge"           # MIT, Harvard, Microsoft, Google
      - "Austin"                       # Tesla, Oracle, AMD, growing tech hub
      - "San Diego"                    # ServiceNow, Qualcomm
      - "Washington DC"                # Palantir, Scale AI, government
      - "Pittsburgh"                   # CMU, Meta, Google, Aurora
      - "Atlanta"                      # GT home base, Siemens, NVIDIA
      - "Denver / Boulder"             # Growing ML scene
      - "Raleigh / Durham"             # Cisco, IBM, Red Hat, NCSU
    visa_requirements: "H-1B sponsorship required"
    remote_ok: true
    referral_value: "highest"

  tier_2_cross_country:
    name: "India"
    priority: 2
    reason: "Cross-country referrals - friends at target companies can refer internally to US roles"
    cities:
      - "Bangalore"                    # Major tech hub, most companies have offices
      - "Hyderabad"                    # Microsoft, Google, Amazon, ServiceNow, Salesforce
      - "Pune"                         # Cisco, Synopsys, Cadence, Honeywell
      - "Chennai"                      # Cisco, Amazon, PayPal
      - "Mumbai"                       # Financial services ML, some tech
      - "Delhi / Gurgaon"              # Google, Microsoft, Adobe, startups
      - "Noida"                        # Synopsys, Cadence, Samsung
    visa_requirements: "Internal transfer / L1B pathway possible"
    remote_ok: false
    referral_value: "high - internal referral to US teams"
    notes: "Target Indian employees at target companies who can refer to US roles. Fortinet India alumni network valuable."

  tier_3_canada:
    name: "Canada (Toronto / Montreal / Vancouver)"
    priority: 3
    reason: "GT alumni network, work permit pathways (Global Talent Stream), proximity to US"
    cities:
      - "Toronto"                      # Cohere, Vector Institute, NVIDIA, Samsung, Uber ATG
      - "Montreal"                     # Mila, Google Brain, Microsoft Research, Element AI
      - "Vancouver"                    # Amazon, Microsoft, Sony AI, D-Wave
      - "Waterloo"                     # University of Waterloo, BlackBerry, ApplyBoard
      - "Ottawa"                       # Shopify, Nokia, Kanata tech park
    visa_requirements: "Global Talent Stream (2-week permit), potential TN visa later"
    remote_ok: true
    referral_value: "medium-high - Canadian employees can refer to US"
    notes: "Cohere Toronto, GT alumni at Vector/Mila, easier work permits than US"

  tier_4_other:
    name: "Other Countries"
    priority: 4
    reason: "Only if exceptional rationale (former manager, close peer, unique opportunity)"
    cities:
      - "London, UK"                   # DeepMind, Meta, Google, Amazon, many fintech
      - "Berlin, Germany"              # Zalando, Siemens, NVIDIA, research institutes
      - "Paris, France"                # Meta AI, Google, Dassault, Mistral, HuggingFace
      - "Zurich, Switzerland"          # Google, Meta, Microsoft, ETH, NVIDIA
      - "Tel Aviv, Israel"             # NVIDIA, Microsoft, Google, cybersecurity ML
      - "Tokyo, Japan"                 # Sony AI, Preferred Networks, Mitsubishi
      - "Singapore"                    # Google, Meta, Amazon, Grab, Sea
      - "Sydney, Australia"            # Atlassian, Canva, Google, CSIRO
    visa_requirements: "Complex - country specific, generally not H-1B pathway"
    remote_ok: true
    referral_value: "low - unless direct connection to US team"
    notes: "Only pursue if: former manager moved there, close peer at target company, or unique specialist role (T4 companies)"

