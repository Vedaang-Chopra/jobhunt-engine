# Canonical Scoring Configuration
# Single source of truth for job scoring. score_jobs.py READS this file.
# Established 2026-08-22 per user directive (Opportunity Strategy v2).
# Weights sum to 100.

version: "2026-08-22"

weights:
  role_fit: 15
  research_alignment: 12
  technical_alignment: 10
  agentic_reasoning_alignment: 8
  post_training_model_improvement_alignment: 8
  attainability: 15
  asymmetric_advantage: 8
  company_quality: 8
  strategic_career_value: 6
  referral_network_strength: 4
  location_fit: 3
  urgency_freshness: 3

# Keyword evidence is capped per dimension so no single term dominates.
evidence_caps:
  max_points_per_keyword: 3          # even RLHF gets at most this
  max_dimension_from_keywords_pct: 60  # keywords can supply at most 60% of a dimension

candidate_evidence:
  # VERIFIED strengths (from profile_info/ — do not edit here, mirror only)
  production_ml_years: 4.5
  agentic_projects: [CAD_pipeline, ATHENA, SHASTRA, fortinet_agentic_rag]
  eval_projects: [CAD_harness_202_tests, ATHENA_metrics, ARTEMIS_benchmarks]
  inference: [vLLM_serving, ONNX_edge_deployment, ARTEMIS_routing]
  rl_academic: [PPO_variants, DQN, reward_shaping_curriculum_selfplay]   # always "(academic)"
  pt_transferable:
    - inference_time_search_verifiable_reward   # CAD methodology
    - reward_based_routing                       # ARTEMIS mode
    - evaluation_rigor                           # harness + ablations
    - deep_rl_coursework
  systems_backend: [golang_opensearch_scaling, python_production, fastapi]
  security_domain: fortinet_aiops                # asymmetric advantage vs security companies

# Attainability modifiers (applied to base from experience/education fit)
attainability_modifiers:
  requires_phd: -25
  requires_deep_pt_specialization_no_transfer_path: -15   # e.g., "led RLHF program"
  accepts_transferable_ml_research_systems: +10
  entry_or_newgrad_friendly: +5
  requires_10plus_years: -30
  us_location_visa_friendly: +5
  location_hard_mismatch: -15

asymmetric_advantage_triggers:
  security_ai_company:            {points: 25, note: "Fortinet background = credible hiring narrative"}
  competitor_or_adjacent_fortinet: {points: 20, note: "Domain adjacency"}
  gt_alumni_heavy:                {points: 10, note: "Alumni network strength"}
  existing_connection_or_referral: {points: 15, note: "Warm path exists"}

company_quality_priors:             # 0-100; overridable in companies.csv
  frontier_lab: 90
  big_tech_ai: 85
  ai_native_leader: 85
  ai_infrastructure: 80
  enterprise_ai: 75
  security_ai: 70                    # raised by advantage scoring, not priors
  strong_startup: 70
  specialist_cad_sim: 65

opportunity_levels:
  L1_high_probability:  {min_priority: 78, description: "Strong fit + domain advantage + realistic requirements"}
  L2_strong_realistic:  {min_priority: 62, description: "Credible qualifications for research/applied roles at good AI companies"}
  L3_optimistic:        {min_priority: 45, description: "Not obvious candidate; transferable evidence justifies applying"}
  L4_stretch_upside:    {min_priority: 0,  description: "Frontier/specialization-heavy; lower probability, exceptional upside"}

recommended_actions:
  APPLY_NOW:     "Strong role + strong fit. Customize resume, apply, find referral, identify HM/team, search hiring posts, outreach."
  APPLY:         "Good fit. Customize appropriately, apply, network when useful."
  OPTIMISTIC:    "Lower probability but credible. Apply, strong customization, targeted outreach."
  STRETCH:       "Very competitive but strategically valuable. Apply selectively, deep customization, researcher/referral outreach where possible."
  LOW_PRIORITY:  "Keep searchable but don't consume significant time."
  SKIP:          "Genuinely irrelevant, closed, impossible, or clearly unsuitable."

action_thresholds:
  APPLY_NOW: 80
  APPLY: 68
  OPTIMISTIC: 55
  STRETCH: 40
  LOW_PRIORITY: 25
  SKIP: null          # below 25 or hard-blockers (closed/expired/irrelevant)

hard_blockers:
  - status_closed_or_expired
  - is_medical_false_positive
  - location_legally_impossible

research_alignment_signals:
  strong: [experimentation, new methods, evaluation, hypothesis testing, model behavior,
           benchmarks, publications, prototypes, research]
  medium: [agents, planning, reasoning, tool use, memory, long-horizon, RAG, retrieval,
           context engineering, multimodal, synthetic data, fine-tuning, post-training,
           SFT, RLHF, DPO, GRPO, reward modeling, inference optimization,
           production research systems]

work_type_classification:
  1_research: "Primary output is new methods/knowledge"
  2_applied_research_rd: "R&D toward product; experimentation central"
  3_research_heavy_engineering: "Engineering with substantial research component"
  4_applied_ai_engineering: "Building AI products with established methods"
  5_general_ml_engineering: "ML engineering without research component"
  6_unrelated: "Low-value for candidate goals"

preference_order: [2_applied_research_rd, 1_research, 3_research_heavy_engineering,
                   4_applied_ai_engineering, 5_general_ml_engineering, 6_unrelated]

override_policy:
  allowed: true
  required_fields: [override_reason, override_by, override_date]
  example: "Raise priority despite lower attainability: HM outreach already responded positively"
