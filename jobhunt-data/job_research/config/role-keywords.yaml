# Classification rules for JD parsing
classification_rules:
  # Minimum keyword matches to assign primary role family
  min_primary_matches: 2
  # If multiple families match, use secondary keywords as tiebreaker
  use_secondary_tiebreaker: true
  # If post-training keywords appear, flag as "post-training" but don't assign as primary
  flag_post_training: true
  # Default to applied-ai if no strong match
  default_family: "applied-ai"