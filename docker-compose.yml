# Optional Docker route — launchd LaunchAgent is the primary deployment
# (see service.sh + ~/Library/LaunchAgents/com.jobhunt.ui.plist).
#
# Fixes vs previous version:
#   - bind mount to repo jobhunt-data instead of a named volume (prevents a
#     diverged second copy of the master jobs.csv)
#   - host network so linkedin_posts_sweep.py can reach logged-in Chrome CDP
#     on localhost:9222 (note: Chrome itself still runs on the macOS host;
#     sweeps that need Playwright browsers must run on the host)
services:
  jobhunt-ui:
    build: .
    image: jobhunt-engine
    network_mode: host
    environment:
      - JOBHUNT_HOME=/data
    volumes:
      - ./jobhunt-data:/data
    restart: unless-stopped

# No top-level volumes: data is bind-mounted from the repo.
