# Application Answer Bank
#
# Canonical source for automated application filling.
# Provenance rules:
#   - values sourced ONLY from profile_info/ verified facts
#   - "confirmed_by_extension": label seen answered in Simplify Copilot storage
#   - ASK_USER entries are never auto-filled; they pause the pipeline

meta:
  created: 2026-08-22
  sources:
    - profile_info/profile.md (authoritative)
    - profile_info/preferences/preferences.md
    - execution_results/simplify_questions_extract.json (question labels observed)

identity:
  first_name: Vedaang            # profile.md
  last_name: Chopra              # profile.md
  full_name: Vedaang Chopra      # profile.md
  email: vedaangchopra@gatech.edu  # profile.md
  phone: "+1 (404) 740-9905"     # profile.md
  phone_stripped: "4047409905"
  location: Atlanta, GA          # profile.md
  linkedin: https://linkedin.com/in/vedaang-chopra  # profile.md
  github: https://github.com/Vedaang-Chopra         # profile.md

education:
  degree: Masters                # profile_info/education
  university: Georgia Institute of Technology
  graduation: 2026-12            # confirm month before use

work_authorization:
  # From preferences.md: F-1, OPT eligible Dec 2026, H-1B required long-term.
  # These are policy-sensitive; pipeline treats them as CONFIRM_WITH_USER on first
  # use per company, then caches the exact phrasing answered here.
  authorized_to_work_us: ASK_USER   # F-1 pre-OPT nuance depends on role start date
  require_sponsorship: ASK_USER     # "yes" for H-1B; phrasing varies by form
  sponsorship_note: >
    F-1 visa. OPT eligible December 2026. Requires H-1B sponsorship for
    long-term employment. Never auto-answer legal attestation questions.

demographics:
  # EEO self-identification. User manually entered these on live forms
  # (Scale AI 2026-08-22) - recorded as USER_CONFIRMED for future auto-fill.
  gender: Male                    # USER_CONFIRMED 2026-08-22
  ethnicity:
    hispanic_latino: "No"         # USER_CONFIRMED 2026-08-22
    race: Asian                   # USER_CONFIRMED 2026-08-22
  veteran_v2: I am not a protected veteran  # USER_CONFIRMED 2026-08-22
  disability_v2: No, I do not have a disability and have not had one in the past  # USER_CONFIRMED 2026-08-22
  lgbt_v2: I am not              # USER_CONFIRMED 2026-08-22 ("I am straight")

reusable_answers:
  how_did_you_hear:
    default: LinkedIn
    status: CONFIRMED_BY_EXTENSION   # seen answered in Simplify storage
  willing_to_relocate:
    default: "Yes"
    status: USER_CONFIRMED_2026_08_22
  open_to_hybrid_office:
    default: "Yes"
    status: USER_CONFIRMED_2026_08_22  # Scale AI 3x/week question answered Yes
  earliest_start_date: ASK_USER      # depends on OPT card timing
  employer_agreements_restrictions:
    default: "No"
    status: USER_CONFIRMED_2026_08_22
  current_employer: Fortinet Technologies   # profile_info/experience
  current_title: Software Development Engineer II (ML/AI)
  location_preference: San Francisco first, New York second

# Verified against profile_info/experience/: only Fortinet + Georgia Tech.
# Safe to answer "No" for any employer not listed there; pipeline must check
# the employer name against experience records before answering.
company_specific:
  previous_employee:
    default: "No"
    condition: employer not in [Fortinet, Georgia Institute of Technology]
    else: ASK_USER

never_auto_fill:
  - passwords / account creation credentials
  - government IDs (SSN etc.)
  - salary expectations            # strategy decision, per-application only
  - legal attestations without explicit user confirmation this session
